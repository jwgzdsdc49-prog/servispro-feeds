name: Update price feeds
on:
  schedule:
    - cron: '17 3 * * *'   # every day ~05:17 Vilnius time
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/build-feeds.mjs
      - name: Commit if changed
        run: |
          git config user.name "feed-bot"
          git config user.email "feed-bot@users.noreply.github.com"
          git add docs
          git diff --cached --quiet || (git commit -m "Update feeds $(date -u +%F)" && git push)
